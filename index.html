<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Title / SEO / social-card tags.
             Runtime:    applyMeta() in js/renderer.js fills these from contents/data.json
                         (works locally and for JS-rendering crawlers like Google).
             Build-time: scripts/inject-meta.js (GitHub Actions) writes them statically
                         between the markers below so social crawlers, which don't run
                         JS, also see them. Everything between the markers is
                         auto-generated — do not edit by hand. -->
        <!-- meta:auto:start -->
        <title> Home </title>
        <!-- meta:auto:end -->
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">

        <!-- JS scripts. `defer` keeps them non-blocking and in document order;
             the init call below runs on DOMContentLoaded, after they load. -->
        <script defer src="js/meta.js"></script>
        <script defer src="js/connection.js"></script>
        <script defer src="js/renderer.js"></script>
        <script defer src="js/navigation.js"></script>
        <script defer src="js/themes.js"></script>

        <!-- CSS style sheets. -->
        <link rel="stylesheet" href="css/colors.css">
        <link rel="stylesheet" href="css/page.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/annotation.css">
        <link rel="stylesheet" href="css/publications.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap">

        <!-- Google tag (gtag.js) -->
        <script async
            src="https://www.googletagmanager.com/gtag/js?id=G-J2PHKKZGJE"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-J2PHKKZGJE');
        </script>
    </head>

    <body class="theme-iro-silent">

        <div class="navbar">
            <a href="#" onclick="loadHome()"> Home </a>
            <a href="#" onclick="loadContent('theme')"> Theme </a>
        </div>

        <div class="content" id="content-main">
            <!-- Content will be loaded here -->
        </div>

        <script>
            // Deferred scripts finish before DOMContentLoaded, so the
            // functions they define are available here.
            window.addEventListener('DOMContentLoaded', () => {
                loadHome();
                initTheme();
            });
        </script>
    </body>
</html>
