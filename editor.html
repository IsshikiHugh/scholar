<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> Editor — Yan XIA </title>
        <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">

        <!-- Existing CSS (needed for preview rendering) -->
        <link rel="stylesheet" href="css/colors.css">
        <link rel="stylesheet" href="css/page.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/annotation.css">
        <link rel="stylesheet" href="css/publications.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap">

        <!-- Editor CSS -->
        <link rel="stylesheet" href="css/editor.css">

        <!-- Existing JS (needed for preview rendering) -->
        <script src="js/connection.js"></script>
        <script src="js/renderer.js"></script>
        <script src="js/themes.js"></script>

        <!-- Editor JS -->
        <script src="js/editor-schema.js"></script>
        <script src="js/editor.js"></script>
    </head>

    <body class="theme-iro-silent">

        <div class="editor-root">
            <!-- Left: Editor -->
            <div class="editor-left">
                <div class="editor-header">
                    <span class="editor-header-title">Content Editor</span>
                    <div class="editor-header-actions">
                        <button class="editor-btn" id="btn-copy">Copy JSON</button>
                    </div>
                </div>
                <div class="editor-body">
                    <div class="editor-tabs" id="editor-tabs">
                        <!-- Tabs generated by editor.js -->
                    </div>
                    <div class="editor-form-panel" id="editor-form">
                        <!-- Form generated by editor.js -->
                    </div>
                </div>
            </div>

            <!-- Resize handle -->
            <div class="editor-resize-handle" id="btn-toggle-preview"></div>

            <!-- Right: Preview -->
            <div class="editor-right" id="editor-preview-panel">
                <div class="editor-header editor-header-preview">
                    <span class="editor-header-title">Preview</span>
                </div>
                <div class="editor-preview-scroll">
                    <div class="navbar">
                        <a href="#"> Home </a>
                        <a href="#"> Theme </a>
                        <a href="#"> Coming </a>
                    </div>
                    <div class="content" id="editor-preview">
                        <!-- renderHome() output injected here -->
                    </div>
                </div>
            </div>
        </div>

        <script>
            initTheme();
            initEditor();
        </script>
    </body>
</html>
